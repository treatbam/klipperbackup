[server]
host: 0.0.0.0
port: 7125
max_upload_size: 1024
klippy_uds_address: /home/pi/printer_data/comms/klippy.sock
[database]
[data_store]
temperature_store_size: 600
gcode_store_size: 1000
[file_manager]
queue_gcode_uploads: True
enable_object_processing: True
[timelapse]
output_path: ~/printer_data/timelapse/
frame_path: /tmp/timelapse/printer
[mqtt]
address: 100.100.86.221
port: 1883
username: eventstream
password: 122122
mqtt_protocol: v3.1.1
enable_moonraker_api: True
instance_name: mainpi
status_objects:
  webhooks
  toolhead=position,print_time,homed_axes
  extruder=temperature
default_qos: 0
[sensor tasmota_power]
type: mqtt
state_topic: tele/tasmota_4FB65B/SENSOR
state_response_template:
  {% set resp = payload|fromjson %}
  {% set edata = resp["ENERGY"] %}
  {set_result("energy", edata["Total"])}
  {set_result("voltage", edata["Voltage"])}
  {set_result("power", edata["Power"])}
  {set_result("current", edata["Current"])}
parameter_power:
  units=W
parameter_voltage:
  units=V
parameter_current:
  units=mA
parameter_energy:
  units=kWh
history_field_energy_consumption:
  parameter=energy
  desc=Printer energy consumption
  strategy=delta
  units=kWh
  init_tracker=true
  precision=6
  exclude_paused=false
  report_total=true
  report_maximum=true
history_field_average_current:
  parameter=current
  desc=Average current draw
  strategy=average
  units=A
  report_total=true
  report_maximum=true
history_field_max_current:
  parameter=current
  desc=Maximum current draw
  strategy=maximum
  units=A
  init_tracker=true
  report_total=false
  report_maximum=false
